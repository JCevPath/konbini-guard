services:
  jenkins:
    build: .
    container_name: konbiniguard_jenkins
    user: root 
    restart: unless-stopped
    ports:
      - "8081:8080" 
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_data:
