services:
  db:
    image: postgres:16-alpine
    container_name: konbiniguard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: konbiniguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d konbiniguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory:
    build: ./inventory
    container_name: konbiniguard-inventory
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/konbiniguard
    depends_on:
      db:
        condition: service_healthy

  notification:
    build: ./notification
    container_name: konbiniguard-notification
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/konbiniguard
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: