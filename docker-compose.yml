version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: konbiniguard_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - konbini_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - konbini_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    image: konbiniguard/backend:${TAG:-latest}
    container_name: konbiniguard_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - konbini_network

  checker:
    build:
      context: ./notification
      dockerfile: Dockerfile
    image: konbiniguard/checker:${TAG:-latest}
    container_name: konbiniguard_checker
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - konbini_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: konbiniguard/frontend:${TAG:-latest}
    container_name: konbiniguard_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
      - checker
    networks:
      - konbini_network

volumes:
  konbini_db_data:

networks:
  konbini_network:
    driver: bridge